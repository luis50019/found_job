services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - job_radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-change_me}@postgres:5432/jobradar
      ENABLE_JOOBLE: ${ENABLE_JOOBLE:-true}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  job_radar_postgres:
